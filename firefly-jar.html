<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firefly jar</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:grid;place-items:center;background:transparent;font-family:'Press Start 2P',ui-monospace,Menlo,monospace}
.card{width:min(100%,440px);margin:10px;padding:20px;border-radius:24px;color:#fff;text-shadow:2px 2px 0 #e87aa6;text-align:center;
  background:linear-gradient(135deg,#ffe3ee 0%,#ffc2d8 50%,#f9a8c9 100%)}
.head{display:flex;justify-content:space-between;font-size:9px;margin-bottom:12px}
canvas{display:block;margin:0 auto;width:min(100%,300px);aspect-ratio:150/170;border-radius:16px;image-rendering:pixelated;cursor:pointer;
  box-shadow:0 5px 0 #e87aa6,inset 0 0 0 3px #fff;touch-action:manipulation}
.note{margin:16px auto 12px;max-width:340px;min-height:96px;padding:14px;border-radius:14px;background:rgba(255,255,255,.78);color:#e87aa6;text-shadow:none;
  font-size:8px;line-height:2;word-break:break-word;display:flex;flex-direction:column;justify-content:center;gap:10px}
.when{font-size:7px;color:#c85a89}
.btns{display:flex;gap:8px;justify-content:center}
button{font:inherit;font-size:9px;color:#fff;text-shadow:2px 2px 0 #e87aa6;background:#ff9fc3;border:0;border-radius:10px;padding:11px 13px;cursor:pointer;box-shadow:0 4px 0 #e87aa6}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #e87aa6}
button:disabled{opacity:.45;cursor:default;box-shadow:none}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
.add{display:flex;gap:8px;max-width:340px;margin:0 auto 12px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:8px;padding:11px;border-radius:8px;border:0;color:#e87aa6}
</style>
</head>
<body>
<main class="card">
  <div class="head"><span>FIREFLY JAR</span><span id="count">0 FIREFLIES</span></div>
  <canvas id="c" width="150" height="170" aria-label="A jar of fireflies. Tap a firefly to read its thought."></canvas>
  <div class="note" id="note" aria-live="polite"></div>
  <div class="add">
    <input type="text" id="txt" maxlength="120" placeholder="WRITE A THOUGHT..." aria-label="Write a thought">
    <button id="addb">CATCH</button>
  </div>
  <button id="rand">READ A RANDOM ONE</button>
</main>
<script>
const W=150,H=170,$=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d');
const HUES=['#ff8fc0','#ffe27a','#c9b3ff','#9ff0d6'],KEY='firefly_jar_v1',MAX=25;
const JX0=42,JX1=108,JY0=52,JY1=142;
const KIND=['FLY FREE','LIGHTER NOW','IT CAN GO','LET IT DRIFT AWAY','BREATHE OUT'];
const slow=matchMedia('(prefers-reduced-motion: reduce)').matches?.4:1;
let F=[],out=[],sel=null,lid=0,t=0,msgT=0;
const stars=Array.from({length:28},()=>({x:Math.random()*W,y:Math.random()*100,sp:1+Math.random()*2,ph:Math.random()*6,big:Math.random()<.2}));
const rnd=(a,b)=>a+Math.random()*(b-a);
function place(f){f.x=rnd(JX0+8,JX1-8);f.y=rnd(JY0+8,JY1-8);f.vx=rnd(-12,12);f.vy=rnd(-12,12);f.ph=rnd(0,6.28);f.born=t}
try{F=(JSON.parse(localStorage.getItem(KEY))||[]).filter(f=>f&&f.text);F.forEach(place);F.forEach(f=>f.born=-9)}catch(e){F=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(F.map(({id,text,date,col})=>({id,text,date,col}))))}catch(e){}};

function note(msg,when,btns){
  const n=$('note');n.innerHTML='';
  const p=document.createElement('div');p.textContent=msg;n.append(p);
  if(when){const w=document.createElement('div');w.className='when';w.textContent=when;n.append(w)}
  if(btns){
    const b=document.createElement('div');b.className='btns';
    const k=document.createElement('button');k.textContent='KEEP';k.onclick=()=>{sel=null;idle()};
    const g=document.createElement('button');g.textContent='LET GO';g.onclick=release;
    b.append(k,g);n.append(b);
  }
}
function idle(){
  $('count').textContent=F.length+(F.length===1?' FIREFLY':' FIREFLIES');
  $('rand').disabled=!F.length;
  if(sel!=null){const f=F.find(q=>q.id===sel);if(f){note(f.text,f.date,true);return}}
  note(F.length?'TAP A FIREFLY TO READ IT, OR LET IT GO WHEN YOU ARE READY.':'YOUR JAR IS EMPTY. WRITE A THOUGHT TO CATCH YOUR FIRST FIREFLY.');
}
function add(){
  const v=$('txt').value.trim();if(!v)return;
  if(F.length>=MAX){note('THE JAR IS FULL. LET ONE GO FIRST.');return}
  const f={id:Date.now()+Math.random(),text:v,date:new Date().toLocaleDateString(undefined,{day:'numeric',month:'short'}).toUpperCase(),col:HUES[Math.floor(Math.random()*HUES.length)]};
  place(f);F.push(f);sel=f.id;$('txt').value='';save();idle();
}
function release(){
  const i=F.findIndex(q=>q.id===sel);if(i<0)return;
  const f=F.splice(i,1)[0];
  out.push({x:f.x,y:f.y,col:f.col,life:1,ph:f.ph});lid=1.4;sel=null;save();
  $('count').textContent=F.length+(F.length===1?' FIREFLY':' FIREFLIES');$('rand').disabled=!F.length;
  note(KIND[Math.floor(Math.random()*KIND.length)]);
  clearTimeout(msgT);msgT=setTimeout(idle,2600);
}
$('addb').onclick=add;
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
$('rand').onclick=()=>{if(F.length){sel=F[Math.floor(Math.random()*F.length)].id;idle()}};
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;
  let best=null,bd=14;
  F.forEach(f=>{const d=Math.hypot(f.x-px,f.y-py);if(d<bd){bd=d;best=f}});
  sel=best?best.id:null;idle();
});

function update(dt){
  t+=dt;
  F.forEach(f=>{
    if(f.id===sel)return;
    f.vx+=rnd(-1,1)*50*dt;f.vy+=rnd(-1,1)*50*dt;
    const s=Math.hypot(f.vx,f.vy),m=16*slow;if(s>m){f.vx*=m/s;f.vy*=m/s}
    f.x+=f.vx*dt*slow;f.y+=f.vy*dt*slow;
    if(f.x<JX0){f.x=JX0;f.vx=Math.abs(f.vx)}if(f.x>JX1){f.x=JX1;f.vx=-Math.abs(f.vx)}
    if(f.y<JY0){f.y=JY0;f.vy=Math.abs(f.vy)}if(f.y>JY1){f.y=JY1;f.vy=-Math.abs(f.vy)}
  });
  out=out.filter(o=>{o.y-=34*dt;o.x+=Math.sin(t*3+o.ph)*12*dt;o.life-=dt*.3;return o.life>0});
  if(lid>0)lid=Math.max(0,lid-dt);
}
function fly(f,alpha,extra){
  const r=7+2*Math.sin(t*3+f.ph)+extra;
  const g=x.createRadialGradient(f.x,f.y,0,f.x,f.y,r);
  g.addColorStop(0,f.col+'bb');g.addColorStop(1,f.col+'00');
  x.globalAlpha=alpha;x.fillStyle=g;x.fillRect(f.x-r,f.y-r,r*2,r*2);
  x.fillStyle=f.col;x.fillRect(Math.round(f.x)-1,Math.round(f.y)-1,3,3);
  x.fillStyle='#fff';x.fillRect(Math.round(f.x),Math.round(f.y)-1,1,1);
  if(Math.sin(t*22+f.ph)>0){x.fillRect(Math.round(f.x)-3,Math.round(f.y)-2,1,2);x.fillRect(Math.round(f.x)+3,Math.round(f.y)-2,1,2)}
  x.globalAlpha=1;
}
function draw(){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b2145');g.addColorStop(1,'#6a3f78');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  stars.forEach(s=>{x.globalAlpha=.35+.65*Math.abs(Math.sin(t*s.sp+s.ph));x.fillStyle='#fff';x.fillRect(Math.round(s.x),Math.round(s.y),s.big?2:1,s.big?2:1)});
  x.globalAlpha=1;
  x.fillStyle='#fff3c9';x.beginPath();x.arc(128,22,9,0,7);x.fill();
  x.fillStyle='#2d2348';x.beginPath();x.arc(133,19,8,0,7);x.fill();
  x.fillStyle='#e87aa6';x.fillRect(24,146,102,8);x.fillStyle='#ffb3d0';x.fillRect(24,146,102,2);
  x.fillStyle='rgba(255,255,255,.07)';x.fillRect(40,46,70,98);
  F.forEach(f=>fly(f,1,Math.max(0,1-(t-f.born))*9));
  out.forEach(o=>fly(o,Math.min(1,o.life*1.5),0));
  if(sel!=null){const f=F.find(q=>q.id===sel);if(f){x.strokeStyle='#fff';x.lineWidth=1;x.strokeRect(Math.round(f.x)-6.5,Math.round(f.y)-6.5,13,13)}}
  x.fillStyle='rgba(255,255,255,.5)';x.fillRect(38,44,2,100);x.fillRect(110,44,2,100);x.fillRect(40,144,70,2);
  x.fillStyle='rgba(255,255,255,.22)';x.fillRect(45,54,2,38);x.fillRect(45,96,2,4);
  const ly=34-Math.min(1,lid)*9;
  x.fillStyle='#ffb3d0';x.fillRect(36,ly,78,10);x.fillStyle='#fff';x.fillRect(36,ly,78,2);x.fillStyle='#e87aa6';x.fillRect(36,ly+8,78,2);
}
let last=0;
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(frame)}
idle();requestAnimationFrame(frame);
</script>
</body>
</html>
